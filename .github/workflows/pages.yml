# Publishes the static mock-up to GitHub Pages.
# One-time setup in the repository: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". After that every push to the branches below
# redeploys the site at https://shikharhub26.github.io/arora-uniforms/
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/dreamy-goldberg-554kjm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
